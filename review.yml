actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists on Fern's own API. Fern's hosted public
    API is the request/response REST Ask Fern API, and the rest of Fern is
    delivered through the open-source `fern` CLI and hosted dashboard. Fern's
    AsyncAPI/WebSocket capability is an input format it consumes to generate
    artifacts for other APIs, so there is no server-push transport on Fern's own
    API to model with an AsyncAPI document.
