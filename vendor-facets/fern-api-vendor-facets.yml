# Vendor facets — Fern. Two products: Fern Docs (hosted docs with llms.txt, Markdown, an
# RFC 9727 api-catalog, a served OpenAPI 3.1, provider-authored skills and an Ask-Fern MCP
# server) and Fern SDK generation (nine languages, plus an early-access CLI generator). It is the
# widest reach in this set: SDKs and a CLI move Developer Ergonomics points no docs-only platform
# can touch, and `fern api enrich` can write examples into the contract itself.
vendor: fern-api
name: Fern
website: https://buildwithfern.com
areas:
- documentation
- sdk-generation
registry_keys:
- fern
rubric_schema_version: 0.22.0
generated: '2026-09-25'
features_refreshed: '2026-09-25'
basis: measured
summary: >-
  Fern reaches further than any documentation-only vendor: generated SDKs published to the provider's
  own registries earn sdk_count_1 and sdk_count_3, the CLI generator earns cli_present, and `fern api
  enrich` merges AI-generated examples into the OpenAPI, the one route here into contract-side examples.
  The docs side adds llms.txt, an RFC 9727 api-catalog, a served OpenAPI 3.1 and a place to publish skills
  the provider writes. The qualifiers: the docs MCP server is one Ask-Fern template graded `platform`,
  SDKs and the CLI count only once published and declared, the CLI generator is early access, and the
  served contract only adds a contract for a provider whose source is not already OpenAPI.
features:
- id: sdk-generator
  name: SDK generation in nine languages
  description: >-
    Generates TypeScript, Python, Go, Java, C#, PHP, Ruby, Swift and Rust SDKs from OpenAPI or a Fern
    definition, and publishes them to npm, PyPI, Maven Central, NuGet and others.
  source: https://buildwithfern.com/learn/sdks/overview/capabilities
  tier: unknown
- id: sdk-idempotency
  name: SDK idempotency headers, retries and pagination
  description: >-
    Generated SDKs carry idempotency headers, retries with backoff, auto-pagination, OAuth token refresh
    and webhook signature verification.
  source: https://buildwithfern.com/learn/sdks/overview/capabilities
  tier: unknown
- id: cli-generator
  name: CLI generator
  description: >-
    Generates a single-binary CLI from an OpenAPI or GraphQL definition and publishes it to npm, Homebrew
    and GitHub Releases.
  source: https://buildwithfern.com/learn/cli-generator/get-started/overview
  tier: unknown
- id: hosted-docs
  name: Fern Docs hosted site and API reference
  description: A hosted docs site with guides and a generated API reference on the provider's domain.
  source: https://buildwithfern.com/learn/docs/getting-started/capabilities
  tier: unknown
- id: api-explorer
  name: API Explorer
  description: >-
    Authenticated real calls from the reference, prefilled from spec defaults, across all declared auth
    schemes.
  source: https://buildwithfern.com/learn/docs/api-references/api-explorer
  tier: unknown
- id: sdk-snippets
  name: SDK and HTTP snippets in the reference
  description: SDK and HTTP code examples generated from the request/response examples in the definition.
  source: https://buildwithfern.com/learn/docs/llms.txt
  tier: unknown
- id: ai-examples
  name: AI-generated examples and `fern api enrich`
  description: >-
    Generates realistic request/response examples for every endpoint; `fern api enrich` merges them into
    native OpenAPI example fields.
  source: https://buildwithfern.com/learn/docs/ai-features/ai-examples
  tier: unknown
- id: llms-txt
  name: Generated llms.txt at every level
  description: Maintains llms.txt at the root and per section, linking the served OpenAPI and AsyncAPI
    specs.
  source: https://buildwithfern.com/learn/docs/ai-features/llms-txt
  tier: unknown
- id: api-catalog
  name: RFC 9727 api-catalog
  description: >-
    Serves /.well-known/api-catalog generated from the visible API reference, advertised in a Link header;
    empty for authenticated sites.
  source: https://buildwithfern.com/learn/docs/ai-features/api-catalog
  tier: unknown
- id: served-openapi
  name: Served OpenAPI 3.1 (and AsyncAPI 2.6)
  description: >-
    Every docs site serves /openapi.json and /openapi.yaml generated from the same definition as the docs,
    including webhooks and security schemes.
  source: https://buildwithfern.com/learn/docs/developer-tools/openapi-spec
  tier: unknown
- id: custom-skills
  name: Provider-authored Agent Skills hosting
  description: >-
    Serves skills the provider places under fern/.well-known/agent-skills/ with a v0.2.0 index and an
    Install skills button.
  source: https://buildwithfern.com/learn/docs/ai-features/host-skills
  tier: unknown
- id: docs-mcp
  name: MCP server for the docs site
  description: >-
    A Fern-hosted MCP server at <docs>/_mcp/server with one Ask-Fern question-answering tool, on sites
    with Ask Fern enabled.
  source: https://buildwithfern.com/learn/docs/ai-features/mcp-server
  tier: unknown
- id: changelog
  name: Changelog pages with RSS
  description: A changelog folder renders dated, tag-filterable entries with an RSS feed.
  source: https://buildwithfern.com/learn/docs/configuration/changelogs
  tier: unknown
- id: postman-generator
  name: Fern-to-Postman generator (deprecated)
  description: >-
    The Postman collection generator is no longer maintained; Fern points users to Postman's OpenAPI import.
  source: https://buildwithfern.com/learn/docs/integrations/postman
  tier: unknown
- id: markdown-access
  name: Markdown pages and agent directives
  description: >-
    Every page as Markdown at <url>.md, with a configurable directive prepended to pages served to agents.
  source: https://buildwithfern.com/learn/llms.txt
  tier: unknown
