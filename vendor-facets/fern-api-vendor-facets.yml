earns_nothing:
- feature: postman-generator
  check: postman_present
  why: >-
    Fern's Postman generator is deprecated; a collection now comes from the provider importing its own
    OpenAPI into Postman.
- feature: docs-mcp
  check: well_known_published
  why: >-
    The MCP server is advertised by page actions, not by any of the four well-known documents; only the
    api-catalog row earns this check.
out_of_reach:
  checks:
  - agent_card
  - rules_present
  - info_complete
  - operations_description_coverage
  - error_semantics
  - status_page_present
  note: >-
    Fern serves no A2A agent card and ships no governance ruleset; it cannot write the prose (info contact,
    operation descriptions) or the error model a contract is missing.
unscored_practice:
- feature: markdown-access
  why: >-
    Markdown twins and agent directives prepended to pages; no check reads agent-facing directives or
    markdown negotiation.
- feature: served-openapi
  why: >-
    A served AsyncAPI 2.6 and a contract linked from llms.txt are real agent-discovery practice the rubric
    scores only as a contract, not as its discoverability.
- feature: sdk-idempotency
  why: Webhook signature verification in generated SDKs is agent-safety practice no check reads.
