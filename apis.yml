aid: fern-api
url: https://raw.githubusercontent.com/api-evangelist/fern-api/refs/heads/main/apis.yml
name: Fern
kind: company
description: >-
  Fern is a developer-tools platform that turns a single API specification into
  idiomatic client SDKs, beautiful API documentation, and MCP servers. Given
  OpenAPI, AsyncAPI, gRPC/Protobuf, or Fern's own Fern Definition as input, Fern
  generates type-safe SDKs in TypeScript, Python, Go, Java, C#, PHP, Ruby, Swift,
  and Rust, publishes them to registries like npm, PyPI, and Maven, and builds a
  hosted docs site with an interactive API reference, API playground, and an
  AI-powered "Ask Fern" search. The primary interface is the open-source `fern`
  CLI (Apache-2.0, github.com/fern-api/fern) driving a hosted platform - the
  fern-api catalog documents Fern's SDK-generation, documentation-generation, and
  Fern Definition capability surfaces as capability areas, plus the one hosted
  public REST API Fern exposes to customers, the Ask Fern API. Fern is
  open-core: the CLI and generators are open source, and Docs and SDKs are sold
  on Hobby (free), Team, and Enterprise plans.
