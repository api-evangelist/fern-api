    the indexed content for grounded, hallucination-resistant answers to build
    your own support integrations. Authenticated with a Bearer token from
    `fern token`; available on Team and Enterprise plans. The website
    index/status endpoints are grounded in the published reference; the /ask
    query shape is modeled.
