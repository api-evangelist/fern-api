meters:
- name: subscription_seats
  description: Team member seats included in the plan tier (Hobby 2, Team 5, Enterprise custom).
  unit: seats
  aggregation: max
  dimensions:
  - account
  - plan
- name: ai_credits
  description: Monthly AI credits consumed by Ask Fern and AI documentation features.
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - plan
- name: cli_compute
  description: Infrastructure cost of running the open-source Fern CLI generators in CI/local (no Fern invoice).
  unit: hours
  aggregation: sum
  dimensions:
  - deployment
principles:
- name: Visibility
  description: Track subscription tier, seat usage, and monthly AI-credit consumption per Fern organization.
- name: Allocation
  description: Map Fern seats and docs/SDK projects to the product or team that owns them.
- name: Optimization
  description: Run SDK and docs generation on the open-source CLI to avoid paid overages; right-size the plan tier to actual seats and AI-credit usage; reserve Enterprise add-ons (self-hosting, SSO) for teams that need them.
- name: Accountability
  description: Assign an owner for the Fern subscription; review seat and AI-credit usage against the plan allowance each cycle.
