- FOCUS
description: >-
  FinOps view of Fern spend. Fern is open-core: the `fern` CLI and code
  generators are open source (Apache-2.0), so running SDK and docs generation
  in your own CI/CD carries only your compute cost with no vendor invoice. The
  hosted Docs and SDK product is a SaaS subscription billed per plan - Hobby
  (free), Team (flat monthly, billed yearly), and Enterprise (custom) - with the
  AI documentation features (Ask Fern) metered against a monthly AI-credit
  allowance included in each plan. The dominant Fern-invoiced cost is the
  subscription tier plus any Enterprise add-ons (self-hosting, SSO, support).
notes: >-
  Team subscription advertised at $150/month billed yearly; Enterprise is
  custom. AI credits (250/mo Hobby, 1000/mo Team) are included allowances, not
  separately metered overages in public docs. Verify current pricing and
  allowances on the Fern pricing page during reconciliation.
